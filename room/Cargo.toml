[package]
name = "room"
version = "0.1.0"
edition = "2021"
description = "Rust port of the doomgeneric Doom engine (library crate; the native platform shell lives in shells/native)"
repository = "https://github.com/sunsided/room"
license = "GPL-2.0"
authors = ["Markus Mayer <widemeadows@gmail.com>"]
readme = "../README.md"

[lib]
name = "room"
path = "src/lib.rs"

[features]
dhat-heap = ["dep:dhat"]
rangecheck = []

[dependencies]
# Safe transmutation between byte slices and typed buffers.
bytemuck = { version = "1", features = ["derive"] }

# Logging facade.
log = "0.4"

# Pure-Rust SF2 soundfont synthesizer. Backs the shell-independent synthesis
# core in `src/audio/synth.rs` (`SynthFont`/`SynthEngine`): the single
# "MIDI bytes -> interleaved stereo f32" implementation shared by the native
# and web audio output adapters.
rustysynth = "1"

# Optional heap profiler (use with --features dhat-heap).
dhat = { version = "0.3", optional = true }

# libc bindings for C FFI (FILE, fopen, fclose, fseek, fread, printf, etc.)
# Host targets keep the real libc; wasm32 swaps in this repo's declaration
# shim, implemented in shells/web/src/wasm_vfs.rs (spec 2 D1).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
libc = "0.2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
woom24-libc = { path = "../shells/web/crt" }

[dev-dependencies]
# Simple logger backed by stderr (used by the demo_playthrough integration test).
env_logger = "0.11"

# C layout-guard tests: compiles test_helpers.c to verify C struct offsets
# match the ported Rust equivalents. Only linked into the test binary.
doomgeneric-sys = { path = "../doomgeneric-sys" }
