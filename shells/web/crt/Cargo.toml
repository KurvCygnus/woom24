[package]
name = "woom24-libc"
version = "0.1.0"
edition = "2021"
description = "Declaration-only libc-shaped seam so room's libc:: paths type-check on wasm32; real bodies live in shells/web/src/wasm_vfs.rs"
repository = "https://github.com/KurvCygnus/woom24"
license = "GPL-2.0"

[lib]
# The lib name is the extern crate name on wasm: room's `libc::` paths resolve
# through it. (Cargo limitation: one dependency key cannot point at different
# sources per target, hence the package-name key.)
name = "libc"
